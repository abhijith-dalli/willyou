<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: rgba(255, 77, 109, 0.5);
      font-size: 20px;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .card {
      position: relative;
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 320px;
      overflow: hidden;
      z-index: 2;
    }

    h1 {
      color: #ff4d6d;
      font-size: 20px;
      min-height: 48px;
    }

    img {
      width: 160px;
      margin: 15px 0;
    }

    .btn {
      padding: 12px 18px;
      margin: 10px;
      font-size: 15px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
    }

    .no {
      background-color: #ddd;
      position: absolute;
      transition: 0.2s ease;
    }

    .note {
      font-size: 13px;
      color: #888;
      margin-top: 10px;
      min-height: 18px;
    }

    .hidden {
      display: none;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      top: 0;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }
  </style>

</head>
<body>

<!-- hearts -->

<script>
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }, 400);
</script>

<div class="card" id="main">
  <h1 id="typing"></h1>

  <img src="cat.gif">

  <div>
    <button class="btn yes" id="yesBtn" onclick="sayYes()">Yes 💖</button>
    <button class="btn no" id="noBtn">No 😢</button>
  </div>

  <div class="note" id="note"></div>
</div>

<div class="card hidden" id="success">
  <h1>Jezzzzziii Yay!! 💃💃🥰</h1>
  <img src="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif">
  <p>You just made my day jezzziii ummahhhhh!!!❤️🫂</p>
   <p>I'm forevaaaa your boyfriendddd 👉👈😈</p>
</div>

<!-- music -->

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
  const text = "Jezzzzziiiiii, Will you be my girlfriend? 🙈🙈❤️";
  let i = 0;

  function typeEffect() {
    if (i < text.length) {
      document.getElementById("typing").innerHTML += text.charAt(i);
      i++;
      setTimeout(typeEffect, 50);
    }
  }

  typeEffect();

  const noBtn = document.getElementById("noBtn");
  const note = document.getElementById("note");
  const card = document.querySelector(".card");
  const yesBtn = document.getElementById("yesBtn");

  const messages = [
    "please don't say no 🥺",
    "think again jeeezzzzii... 😭",
    "I'll be really nice, promise ❤️",
    "Oka chance ivvochu gaaa 😔",
    "come onnnn jezzzzzziii!😩❤️"
  ];

  function moveButton() {
    const cardRect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = cardRect.width - btnRect.width - 20;
    const maxY = cardRect.height - btnRect.height - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    const randomMsg = messages[Math.floor(Math.random() * messages.length)];
    note.innerText = randomMsg;

    // YES button grows 😏
    yesBtn.style.transform = "scale(" + (1 + Math.random() * 0.3) + ")";
  }

  noBtn.addEventListener("mouseover", moveButton);
  noBtn.addEventListener("touchstart", moveButton);

  function sayYes() {
    document.getElementById("main").classList.add("hidden");
    document.getElementById("success").classList.remove("hidden");

    // confetti 🎉
    for (let i = 0; i < 80; i++) {
      const conf = document.createElement("div");
      conf.className = "confetti";
      conf.style.left = Math.random() * 100 + "vw";
      conf.style.background = ["#ff4d6d", "#ffd700", "#00c3ff"][Math.floor(Math.random()*3)];
      conf.style.animationDuration = (Math.random() * 2 + 2) + "s";
      document.body.appendChild(conf);

      setTimeout(() => conf.remove(), 3000);
    }
  }
</script>

</body>
</html>
